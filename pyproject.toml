[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "benchgap"
version = "0.2.0"
description = "Measure how much of a machine-learning benchmark score survives deployment."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "awesomedudeworld13" }]
keywords = ["evaluation", "benchmark", "distribution-shift", "tss", "bootstrap"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.24"]

[project.urls]
Homepage = "https://github.com/awesomedudeworld13/benchgap"
Issues = "https://github.com/awesomedudeworld13/benchgap/issues"

[tool.hatch.build.targets.wheel]
packages = ["benchgap"]
